<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code 掃描測試</title>
<!-- 引入更穩定、辨識率更高的 Html5Qrcode 函式庫 -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f5f5f5;
    padding: 20px;
    margin: 0;
  }
  #reader {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }
  #resultBox {
    margin: 20px auto;
    width: 90%;
    max-width: 500px;
    background: #fff;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    text-align: left;
    word-break: break-all;
  }
  #result {
    color: #d63384;
    font-weight: bold;
    font-size: 18px;
  }
</style>
</head>
<body>

<h2>QR Code 掃描測試</h2>

<div id="reader"></div>

<div id="resultBox">
  <div><strong>掃描結果：</strong></div>
  <div id="result">請將 QR Code 對準上方框線</div>
</div>

<script>
  function onScanSuccess(decodedText, decodedResult) {
    const resultDiv = document.getElementById("result");
    
    // 如果掃描到網址，轉換成可點擊連結
    if (decodedText.startsWith("http://") || decodedText.startsWith("https://")) {
      resultDiv.innerHTML = `<a href="${decodedText}" target="_blank" rel="noopener noreferrer">${decodedText}</a>`;
    } else {
      resultDiv.textContent = decodedText;
    }
  }

  // 初始化掃描器
  const html5QrcodeScanner = new Html5QrcodeScanner(
    "reader",
    { 
      fps: 10, // 每秒掃描次數
      qrbox: { width: 250, height: 250 } // 掃描框大小
    },
    /* verbose= */ false
  );

  html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
