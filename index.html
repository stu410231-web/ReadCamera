<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code 掃描測試</title>

<!-- 引入高辨識率 Html5Qrcode 函式庫 -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

h2 {
  margin-bottom: 20px;
}

/* 攝影機顯示區域 */
#reader {
  width: 90%;
  max-width: 500px;
  height: 250px;
  margin: 0 auto;
  border-radius: 10px;
  background: #000;
  overflow: hidden;
  position: relative;
}

/* 隱藏 Html5Qrcode 預設的掃描框與介面元件 */
#reader img,
#reader__scan_region,
#reader__dashboard,
#reader__status_span {
  display: none !important;
}

/* 讓全畫面 video 填滿畫面，不顯示掃描框 */
#reader video {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  border-radius: 10px;
}

button {
  padding: 10px 20px;
  margin: 10px;
  font-size: 16px;
  cursor: pointer;
  background-color: #efefef;
  border: 1px solid #767676;
  border-radius: 2px;
}

button:hover {
  background-color: #e5e5e5;
}

#resultBox {
  margin: 20px auto;
  width: 90%;
  max-width: 500px;
  background: #fff;
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  text-align: left;
  word-break: break-all;
}

#result {
  color: #d63384;
  font-weight: bold;
  font-size: 18px;
}

#status {
  color: #666;
  margin-top: 10px;
}
</style>
</head>

<body>

<h2>QR Code 掃描測試</h2>

<div id="reader"></div>

<br>

<button onclick="startCamera()">開啟攝影機</button>
<button onclick="stopCamera()">關閉攝影機</button>

<div id="resultBox">
  <div><strong>掃描結果：</strong></div>
  <div id="result">尚未讀到 QR Code</div>
  <div id="status">攝影機已關閉</div>
</div>

<script>
let html5Qrcode = null;
let lastResult = "";

const resultDiv = document.getElementById("result");
const statusText = document.getElementById("status");

async function startCamera() {
  try {
    if (html5Qrcode) {
      await stopCamera();
    }

    html5Qrcode = new Html5Qrcode("reader");

    // 高解析度設定，實現精準掃描且無預設外框
    const config = { 
      fps: 15,
      videoConstraints: {
        facingMode: "environment",
        width: { min: 640, ideal: 1280, max: 1920 },
        height: { min: 480, ideal: 720, max: 1080 }
      }
    };

    await html5Qrcode.start(
      { facingMode: "environment" },
      config,
      onScanSuccess
    );

    statusText.textContent = "攝影機已開啟，請將 QR Code 對準鏡頭";

  } catch (err) {
    console.error(err);
    alert("無法開啟攝影機，請確認已給予存取權限！");
    statusText.textContent = "無法開啟攝影機";
  }
}

function onScanSuccess(decodedText, decodedResult) {
  if (decodedText !== lastResult) {
    lastResult = decodedText;
    
    // 若內容為 HTTP / HTTPS 網址，自動轉換為超連結
    if (decodedText.startsWith("http://") || decodedText.startsWith("https://")) {
      resultDiv.innerHTML = `<a href="${decodedText}" target="_blank" rel="noopener noreferrer">${decodedText}</a>`;
    } else {
      resultDiv.textContent = decodedText;
    }

    statusText.textContent = "已成功讀到 QR Code";
  }
}

async function stopCamera() {
  if (html5Qrcode) {
    try {
      await html5Qrcode.stop();
      html5Qrcode.clear();
      html5Qrcode = null;
    } catch (err) {
      console.error(err);
    }
  }
  statusText.textContent = "攝影機已關閉";
}

window.addEventListener("beforeunload", () => {
  stopCamera();
});
</script>

</body>
</html>
