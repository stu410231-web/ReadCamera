<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code 掃描器</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f4f4f9;
    }
    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }
    #result-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      display: inline-block;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .status-text {
      color: #666;
      font-size: 0.9em;
      margin-top: 5px;
    }
    .success-text {
      color: #28a745;
      font-size: 0.85em;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <h2>QR Code 掃描測試</h2>

  <div id="reader"></div>

  <div id="result-box">
    <div><strong>掃描結果：</strong></div>
    <div id="scan-result">尚未讀到 QR Code</div>
    <div id="status" class="status-text">初始化中...</div>
  </div>

  <script>
    // 填入您在步驟 1 取得的 Google Apps Script Web App URL
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTq7xNEyb3c06JLHbUu67uSdDHBYFOfmAVJJM79048Aj3vNe5Tkv1Bbuh0rcOWcCK4/exec";

    let lastScannedText = "";
    let lastScannedTime = 0;

    // 將資料寫入 Google 試算表
    function saveToGoogleSheet(qrData) {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("填入你的")) {
        console.warn("請先設定正確的 GOOGLE_SCRIPT_URL！");
        return;
      }

      const statusEl = document.getElementById("status");
      statusEl.innerText = "正在儲存至 Google 試算表...";
      statusEl.className = "status-text";

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ qrData: qrData })
      })
      .then(() => {
        statusEl.innerText = "已成功同步至試算表 (儲存庫)！";
        statusEl.className = "success-text";
      })
      .catch((err) => {
        console.error("寫入失敗：", err);
        statusEl.innerText = "寫入試算表失敗，請檢查網路連線。";
      });
    }

    // 掃描成功後的回調函數
    function onScanSuccess(decodedText, decodedResult) {
      const now = Date.now();

      // 防止 3 秒內連續寫入相同的 QR Code
      if (decodedText === lastScannedText && (now - lastScannedTime < 3000)) {
        return;
      }

      lastScannedText = decodedText;
      lastScannedTime = now;

      // 更新畫面顯示
      document.getElementById("scan-result").innerText = decodedText;

      // 發送資料至 Google 試算表
      saveToGoogleSheet(decodedText);
    }

    function onScanFailure(error) {
      // 掃描過程中的幀未發現 QR Code 時的正常忽略
    }

    // 初始化掃描器
    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      { fps: 10, qrbox: { width: 250, height: 250 } },
      /* verbose= */ false
    );

    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
  </script>
</body>
</html>
